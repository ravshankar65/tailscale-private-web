# The existing "cafe" website on the Ubuntu host, reachable ONLY over the tailnet.
#
#   ts-web   : Tailscale sidecar. Joins the tailnet as its own node "web"
#              (tag:web), gets a MagicDNS name and a real Let's Encrypt cert,
#              and terminates HTTPS via Tailscale Serve (serve.json).
#   cafe     : The existing cafe site (Apache httpd, local image "cafe"),
#              unchanged. Listens on :80 inside the sidecar's network namespace.
#   identity : ~100-line helper that echoes the caller's Tailscale identity at
#              /whoami, /me and /healthz. It binds to 127.0.0.1:8080. It proves
#              Serve's identity headers and gives validate.sh something to assert on.
#
# Note: no `ports:` are published. Nothing listens on the host's LAN interface,
# and Docker's iptables rules (which bypass UFW for published ports) never come
# into play. Port 80 on the node's tailnet IP is closed by policy: only tcp:443
# is granted to tag:web, and the policy tests assert that.
#
# The old `my-cafe` container (which published 8082 on the LAN) is stopped,
# not deleted, so it can be restored.

name: private-web

services:
  ts-web:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-stable}
    container_name: ts-web
    hostname: web
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY_WEB:?set TS_AUTHKEY_WEB in .env (see scripts/mint-authkey.sh)}
      - TS_HOSTNAME=web
      - TS_EXTRA_ARGS=--advertise-tags=tag:web
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts-web-state:/var/lib/tailscale   # persist node identity across restarts
      - ./serve.json:/config/serve.json:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 5s
      retries: 3

  cafe:
    image: cafe                     # the existing locally built image, reused as-is
    pull_policy: never
    container_name: cafe-web
    network_mode: service:ts-web    # share the sidecar's network namespace
    depends_on:
      - ts-web
    restart: unless-stopped

  identity:
    build: ./app
    container_name: web-identity
    network_mode: service:ts-web
    environment:
      - BIND_ADDR=127.0.0.1           # loopback only: unreachable except via Serve
      - PORT=8080
      - APP_ENV=homelab
    depends_on:
      - ts-web
    restart: unless-stopped

volumes:
  ts-web-state:
